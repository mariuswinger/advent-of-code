
[tools]
python = "3.13.7"

[env]
_.python.venv = ".venv"

[tasks.init]
description = "Init new directory for given day"
usage = '''
arg "<year>" help="Target year" {
  choices "2024" "2025"
}
arg "<day>" help="Target day"
'''
run = "uv run python main.py --year ${usage_year} init ${usage_day}"

[tasks.solve]
description = "Solve for given day and part"
usage = '''
arg "<year>" help="Target year" {
  choices "2024" "2025"
}
arg "<day>" help="Target day"
arg "<part>" help="Target part" {
  choices "a" "b"
}
flag "--input-file <input-file>" help="Input file to use" default="input.txt"
'''
run = "uv run python main.py --year ${usage_year} solve ${usage_day} ${usage_part} --input-file ${usage_input_file}"


[tasks.submit]
description = "Submit solution for given day and part"
usage = '''
arg "<year>" help="Target year" {
  choices "2024" "2025"
}
arg "<day>" help="Target day"
arg "<part>" help="Target part" {
  choices "a" "b"
}
'''
run = "uv run python main.py --year ${usage_year} submit ${usage_day} ${usage_part}"
